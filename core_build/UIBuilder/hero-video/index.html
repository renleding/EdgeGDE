<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px;
      overflow: hidden; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0F172A;
    }
    #root {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      width: 800px; height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(233,69,96,0.15) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .bg-glow-2 {
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%);
      top: 30%; left: 60%;
      transform: translate(-50%, -50%);
    }
    .brand {
      font-size: 120px; font-weight: 800;
      letter-spacing: 24px; color: #FFFFFF;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .tagline {
      font-size: 48px; font-weight: 300;
      color: #94A3B8; letter-spacing: 2px;
      text-align: center;
      line-height: 1.4;
      max-width: 900px;
    }
    .accent-line {
      width: 80px; height: 4px;
      background: #E94560; border-radius: 2px;
      margin-bottom: 40px;
    }
    .cta-frame {
      margin-top: 60px;
      padding: 20px 60px;
      background: #E94560; border-radius: 12px;
    }
    .cta-text {
      font-size: 28px; font-weight: 600;
      color: #FFFFFF; letter-spacing: 1px;
    }
    .deco-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      position: absolute;
    }
    .deco-line {
      height: 2px;
      position: absolute;
      border-radius: 1px;
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="8"
    data-width="1920"
    data-height="1080"
  >
    <!-- Background glows -->
    <div id="glow1" class="clip" data-start="0" data-duration="8" data-track-index="1">
      <div class="bg-glow" style="opacity:0"></div>
    </div>
    <div id="glow2" class="clip" data-start="0.5" data-duration="7.5" data-track-index="2">
      <div class="bg-glow-2" style="opacity:0"></div>
    </div>

    <!-- Decorative dots -->
    <div id="dot1" class="clip" data-start="1" data-duration="7" data-track-index="3">
      <div class="deco-dot" style="width:8px;height:8px;background:#E94560;top:200px;left:300px;opacity:0"></div>
    </div>
    <div id="dot2" class="clip" data-start="1.2" data-duration="6.8" data-track-index="4">
      <div class="deco-dot" style="width:6px;height:6px;background:#3B82F6;top:700px;left:1400px;opacity:0"></div>
    </div>
    <div id="dot3" class="clip" data-start="1.4" data-duration="6.6" data-track-index="5">
      <div class="deco-dot" style="width:10px;height:10px;background:#10B981;top:350px;right:300px;opacity:0"></div>
    </div>

    <!-- Decorative lines -->
    <div id="line1" class="clip" data-start="1" data-duration="7" data-track-index="6">
      <div class="deco-line" style="width:120px;background:linear-gradient(90deg,transparent,#E94560);top:250px;left:100px;opacity:0"></div>
    </div>
    <div id="line2" class="clip" data-start="1.3" data-duration="6.7" data-track-index="7">
      <div class="deco-line" style="width:80px;background:linear-gradient(90deg,#3B82F6,transparent);top:650px;right:150px;opacity:0"></div>
    </div>

    <!-- Accent line -->
    <div id="accent" class="clip" data-start="1.5" data-duration="6.5" data-track-index="8">
      <div class="accent-line" style="opacity:0"></div>
    </div>

    <!-- Brand -->
    <div id="brand" class="clip" data-start="1.5" data-duration="6.5" data-track-index="9">
      <div class="brand" style="opacity:0">SITE</div>
    </div>

    <!-- Tagline -->
    <div id="tagline" class="clip" data-start="2.5" data-duration="5.5" data-track-index="10">
      <div class="tagline" style="opacity:0">Build Something<br>Amazing Today</div>
    </div>

    <!-- CTA -->
    <div id="cta" class="clip" data-start="3.5" data-duration="4.5" data-track-index="11">
      <div class="cta-frame" style="opacity:0">
        <span class="cta-text">Get Started</span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Background glows
    tl.fromTo("#glow1 .bg-glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 2 }, 0);
    tl.fromTo("#glow2 .bg-glow-2", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 2.5 }, 0.5);

    // Decorative dots — staggered entrance
    tl.to("#dot1 .deco-dot", { opacity: 0.6, duration: 0.8 }, 1);
    tl.to("#dot2 .deco-dot", { opacity: 0.5, duration: 0.8 }, 1.2);
    tl.to("#dot3 .deco-dot", { opacity: 0.7, duration: 0.8 }, 1.4);

    // Decorative lines
    tl.to("#line1 .deco-line", { opacity: 0.4, scaleX: 1, duration: 1 }, 1);
    tl.to("#line2 .deco-line", { opacity: 0.3, scaleX: 1, duration: 1 }, 1.3);

    // Accent line
    tl.fromTo("#accent .accent-line", { width: 0, opacity: 0 }, { width: 80, opacity: 1, duration: 0.8, ease: "power3.out" }, 1.5);

    // Brand — dramatic entrance
    tl.fromTo("#brand .brand",
      { opacity: 0, y: 60, scale: 0.95 },
      { opacity: 1, y: 0, scale: 1, duration: 1.2, ease: "power4.out" },
      1.5
    );

    // Tagline
    tl.fromTo("#tagline .tagline",
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 1, ease: "power3.out" },
      2.5
    );

    // CTA button
    tl.fromTo("#cta .cta-frame",
      { opacity: 0, y: 20, scale: 0.9 },
      { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.7)" },
      3.5
    );

    // Subtle float animation on brand throughout
    tl.to("#brand .brand", { y: -8, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3);

    window.__timelines["main"] = tl;
  </script>
</body>
</html>
