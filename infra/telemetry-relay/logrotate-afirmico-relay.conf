# AFIRMICO telemetry relay — forwarder log rotation.
#
# Install at: /etc/logrotate.d/afirmico-relay
#
# WHY
# ---
# relay-forwarder.service pipes the journal into /opt/relay/logs/fleet-telemetry.log
# with `>>`, so that file grows for as long as the service runs. While
# server_config.json had log_level=warn it stayed frozen at ~1.6 KB because no
# payload lines were ever written — which also meant nobody noticed it was
# unbounded. With log_level=info (required for telemetry to flow at all) it grows
# with real traffic, so it must be capped or the disk eventually fills and
# telemetry stops.
#
# copytruncate is REQUIRED, not a preference
# ------------------------------------------
# relay.py holds the file open and seeks by inode (it must survive the container's
# own log rotation). A standard rename-based rotation would leave the forwarder
# reading the rotated-away inode and it would silently stop forwarding. copytruncate
# keeps the same inode, so the open handle stays valid.
#
# Note this file is a convenience duplicate of the journal: relay.py tolerates
# losing it (it reopens on inode change and waits for the path to reappear), and
# the journal itself is the durable copy with MaxRetentionSec=2week.

/opt/relay/logs/fleet-telemetry.log {
    daily
    rotate 7
    maxsize 100M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0644 root root
}
