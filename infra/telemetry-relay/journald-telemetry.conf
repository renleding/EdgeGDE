# AFIRMICO telemetry relay — journald settings.
#
# Install at: /etc/systemd/journald.conf.d/99-telemetry-no-ratelimit.conf
# then:       sudo systemctl restart systemd-journald
#
# WHY
# ---
# This host is a span port: fleet-telemetry writes each received vehicle payload
# to the journal, and relay-forwarder.service pipes `journalctl -f` into relay.py.
# The journal is therefore not a log, it is the transport. A line journald drops
# is a vehicle signal that never reaches Tier 1.
#
# journald rate-limits by default (RateLimitIntervalSec=30s, RateLimitBurst=10000)
# and drops messages over the limit **silently** — there is no error on the
# forwarder side, the counters simply stop advancing. For an interactive server
# that is sensible protection against a chatty service. Here it is data loss.
#
# Rate limiting is consequently disabled, and the journal is bounded by SIZE
# instead. The host runs no other workload, so the usual argument for rate
# limiting does not apply.

[Journal]
# Disable rate limiting entirely. 0 means "no limit" for both units.
RateLimitIntervalSec=0
RateLimitBurst=0

# Bound by size rather than by rate. The relay is the only writer.
SystemMaxUse=512M
SystemMaxFileSize=64M
RuntimeMaxUse=128M

# Keep a bounded history so a post-incident investigation does not require the
# journal to have been configured in advance.
MaxRetentionSec=2week
