pwa_requirements:
  installable: true
  service_worker:
    cache:
      - app shell
      - versioned assets
      - last-known workspace metadata
      - installed app manifests
      - mission/skill manifests
      - onboarding templates
      - last-known compact agent transients
    forbidden:
      - raw secrets
      - unbounded tool results
      - arbitrary third-party HTML outside the MCP App sandbox
  indexeddb:
    required_stores:
      - canvasState
      - workspaceDrafts
      - mcpAppManifests
      - missionSkillManifests
      - actionProposalDrafts
      - recentToolResults
      - leadDrafts
      - workspaceBundleDrafts
      - pendingSyncQueue
      - localAgentMemory
      - agentPromptTransients
  offline:
    allowed:
      - view cached workspace
      - edit local draft
      - queue mutations
      - inspect cached manifests
      - compose agent requests
      - edit consented lead draft
      - prepare workspace export/import draft
      - compose action proposals for later validation
    forbidden:
      - bypass policy
      - mutate server without sync
      - direct MCP calls
      - activate imported bundle without server trust review
      - apply local-only agent proposals as authoritative

mvp_scope:
  included:
    - native EdgeGDE PWA shell
    - infinite canvas MVP
    - installed MCP app browser
    - EdgeGDE canvas window shell for MCP App UIs
    - sandboxed iframe MCP App rendering default
    - approved native HTMX/Web Component Edge Calculator applet
    - standard sandboxed iframe Edge Calculator MCP App
    - agent panel MVP
    - agent proposal surfaces
    - compact workspace transients
    - mission/skill manifest browser
    - empty-canvas onboarding templates
    - governed workspace bundle export/import review
    - policy-gated snapshot restore
    - D1 metadata
    - DO workspace state
    - KV manifest/customware direct lookup
    - lead session and loan application metadata
    - Aegis permission checks
    - audit events
    - snapshots
    - SSE workspace events
    - IndexedDB local drafts
    - offline sync queue
    - responsive desktop/tablet/mobile PWA layout
  deferred:
    - arbitrary third-party iframe hosting
    - stdio MCP servers
    - CRDT collaboration
    - marketplace publishing
    - advanced workflow graph execution
    - local WebGPU model runtime
    - cross-workspace object links
    - real-time multi-user collaboration

success_definition:
  - user can install an MCP app and see manifest permissions
  - user can place an MCP app object on the canvas inside an EdgeGDE window
  - third-party MCP App UI renders by default as a sandboxed iframe
  - first-party Edge Calculator renders as a lightweight native EdgeGDE applet inside the same window shell
  - standard sandboxed iframe Edge Calculator MCP App renders inside the same window shell
  - user can call an MCP tool through EdgeGDE broker
  - policy denial is visible and audited
  - agent can propose canvas, app, tool, document, workflow, and lead-capture mutations
  - agent proposals require refreshed EdgeGDE state before dependent mutations are applied
  - compact workspace transients summarize selected objects, recent results, and post-write envelopes
  - empty-canvas onboarding templates can create example workspaces without Space Agent runtime
  - workspace mutations require expected_version and correlation_id
  - every mutation creates an audit event
  - snapshot/restore works for workspace state
  - snapshot restore is policy-gated and audited
  - workspace bundle export/import review shows manifest and permission diff
  - PWA installs and loads after offline reload
  - local draft syncs when online
  - local IndexedDB drafts remain non-authoritative after sync
  - offline conflict does not silently overwrite
  - no third-party UI can directly mutate workspace state
  - no worker runtime path calls an LLM directly
  - no KV.list usage in hot paths
  - Edge Calculator accepts number inputs and sliders and returns realtime mortgage results
  - consented calculator payload can create a lead capture draft and loan application draft
  - warm chat window receives only a concise, consented summary of mortgage context

guardrails:
  - NEVER bridge Space Agent runtime files into this product.
  - NEVER expose the Space Agent runtime namespace or app-file persistence model.
  - NEVER let agent proposals apply without EdgeGDE policy, refreshed state, expected_version, and audit.
  - NEVER persist arbitrary third-party UI function source as authoritative renderer.
  - NEVER let third-party UI call MCP servers directly.
  - NEVER expose credentials, tokens, or connection strings to app UIs.
  - NEVER allow arbitrary proxy URLs.
  - NEVER import external-session data without consent, provenance, and audit.
  - NEVER silently submit calculator data as a lead.
  - NEVER apply workspace mutations without expected_version, policy check, and audit.
  - NEVER use local IndexedDB drafts as authoritative server state.
  - NEVER activate imported workspace bundles without trust review, permission diff, and tenant policy.
  - NEVER silently resolve version conflicts.
  - NEVER use KV for listing/querying in runtime paths.
  - NEVER make the worker call an LLM in request execution paths.
  - NEVER mark success without verifying API response, CI, and production health.

open_questions:
  - q1_mvp_ui_mode: >
      Should MVP render MCP App UIs as sandboxed iframes by default, native EdgeGDE applets, or
      both? Recommendation: sandboxed iframe default for MCP Apps standard compatibility; native
      EdgeGDE window/applet adapter for first-party or trusted apps such as Edge Calculator. MVP
      must support both implementations for the mortgage calculator test case.
  - q2_app_placement: >
      Should the PWA live as a new `apps/pwa-canvas` package or inside `apps/edge-runtime/public/pwa`?
      Recommendation: new `apps/pwa-canvas` for clean separation, with edge-runtime routes serving it.
  - q3_mcp_transport: >
      Should MVP support HTTP/SSE/streamable-http only? Recommendation: HTTP/streamable-http only;
      stdio is not browser-native and belongs to server-side agents.
  - q4_conflict_strategy: >
      Should offline conflicts use last-writer-wins for safe object transforms and fail-closed for
      app/tool/mutation actions? Recommendation: yes.
  - q5_agent_runtime: >
      Should agent panels call external Hermes/Aegis orchestration only, or should local browser
      model fallback be included? Recommendation: external orchestration only for MVP.
  - q6_responsive_canvas_windows: >
      What are the required responsive breakpoints for EdgeGDE canvas windows? Recommendation:
      desktop resizable windows, tablet touch-friendly windows, mobile sheet/single-column layout
      with policy surfaces always visible.
  - q7_external_session_warm_chat: >
      How should EdgeGDE import mortgage context from an external chat/session such as ChatGPT?
      Recommendation: explicit consent, provenance metadata, minimized payload, expiry, and audit;
      warm chat receives a summary, not raw unrelated context.
  - q8_space_agent_runtime_boundary: >
      Which Space Agent ideas should remain out of the runtime? Recommendation: keep only agentic
      workspace UX/requirements; exclude Space Agent runtime files, app-file persistence, persisted
      renderer functions, arbitrary browser-side execution blocks, and Space Agent customware layers.
