  design_tokens:
    space_1: "4px"
    space_2: "8px"
    space_3: "12px"
    space_4: "16px"
    space_6: "24px"
    space_8: "32px"
    space_12: "48px"
    grid_columns: "repeat(auto-fit, minmax(260px, 1fr))"
    background_color: "#080b14"
    surface_bg: "rgba(255,255,255,0.08)"
    surface_elevated: "rgba(15,23,42,0.92)"
    border_color: "rgba(148,163,184,0.22)"
    blur: "blur(28px)"
    border_radius: "18px"
    text_primary: "#ffffff"
    text_secondary: "rgba(255,255,255,0.72)"
    accent_primary: "#60a5fa"
    accent_success: "#22c55e"
    accent_warning: "#f59e0b"
    accent_danger: "#ef4444"
  runtime:
