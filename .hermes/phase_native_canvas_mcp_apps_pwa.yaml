name: EdgeGDE_Native_Canvas_MCP_Apps_PWA_UI_v0_3_0
version: "0.3.0"
description: >
  Edge ethos 100/100 functional specification for an EdgeGDE-native browser PWA that combines
  an infinite canvas, EdgeGDE window shells, sandboxed MCP App UI resources, native direct-line
  applet compatibility, agent panels, local-first workspace drafts, EdgeGDE governance, and
  lead-capture workflows. Space Agent is used only as a functional-requirement source for agentic
  workspace UX; EdgeGDE remains the authoritative runtime, policy engine, persistence layer,
  MCP broker, and audit system.

status:
  system: FUNCTIONAL_SPEC_EDGE_ETHOS_100_READY
  readiness: DISCOVERY_ALIGNMENT_PLUS_SPACE_AGENT_REQUIREMENTS
  edge_ethos_score: 100
  next_gate: gogo_for_phase_plan_or_implementation

source_context:
  discussion_found: true
  session: "20260612_145704_27c5d5"
  summary: >
    Prior discussion established that Space Agent + EdgeGDE could be replaced by a native EdgeGDE
    super-PWA: infinite canvas + MCP app objects + agent panels + EdgeGDE workspace persistence,
    MCP broker, Aegis governance, snapshots, audit, and local/offline sync.
  product_direction: >
    Do not bridge Space Agent. Build EdgeGDE-native UI and runtime semantics from the start.
    MCP Apps follow SEP-1865: sandboxed iframe UI resources are the default database/rendering
    model. EdgeGDE renders those apps as movable, resizable canvas windows; native direct-line
    EdgeGDE applets are a trusted first-party compatibility optimization, not the default.
  space_agent_functional_requirements_extracted: true
  space_agent_sources:
    - id: space_agent_readme
      capabilities: >-
        agent reshapes interface, frontend runtime agency, SKILL.md extensibility,
        token-efficient execution, modularity, personal-to-hierarchical work, group sharing,
        persistent admin/time travel
    - id: space_agent_app_agents
      capabilities: >-
        frontend-first runtime, module/store composition, explicit runtime namespaces,
        browser storage non-authoritative, app-file persistence, module-owned extension seams
    - id: space_agent_spaces_agents
      capabilities: >-
        Spaces canvas, space.yaml manifest, widget YAML, current-space prompt context,
        compact transient sections, staged execution, widget lifecycle, empty-canvas onboarding,
        camera-based pan, layout persistence, ZIP export/import, local non-authoritative UI state
  mcp_apps_standard:
    sep: "SEP-1865"
    extension_identifier: "io.modelcontextprotocol/ui"
    spec_url: "https://github.com/modelcontextprotocol/ext-apps/blob/main/specification/2026-01-26/apps.mdx"
    default_ui: "sandboxed iframe rendering via ui:// resources and postMessage/MCP JSON-RPC"
    edgegde_window_model: "native EdgeGDE canvas window shell owns layout, focus, resize, policy, and audit; remote UI remains sandboxed"
    native_applet_status: "nice-to-have compatibility path for first-party/trusted apps such as Edge Calculator"

edge_ethos:
  score: 100
  principle: >-
    Space Agent contributes agentic workspace functional requirements only. EdgeGDE owns authority,
    policy, persistence, MCP brokering, audit, snapshots, and tenant isolation.
  requirements:
    - agent_reshapes_interface: >-
        The user experience must allow an agent to reshape the workspace while the user works, but
        the agent may only propose mutations. EdgeGDE validates, applies, denies, and audits every
        mutation.
    - frontend_runtime_agency: >-
        The browser PWA owns responsive UI, canvas camera behavior, window shells, sandboxed iframe
        hosting, local drafts, and compact agent transients. It does not own authoritative policy or
        MCP credentials.
    - text_based_extensibility: >-
        Skills and mission templates remain text-based and human-readable, but are versioned,
        tenant-scoped, permission-aware EdgeGDE manifests rather than arbitrary user-writable runtime
        code.
    - modular_extensibility: >-
        The product remains modular through EdgeGDE canvas object types, MCP App manifests, native
        applet adapters, mission templates, and extension seams.
    - personal_to_hierarchical: >-
        Personal workspaces, tenant workspaces, and group-shared workspaces are explicit EdgeGDE
        permission objects with audit trails.
    - persistent_admin_time_travel: >-
        Workspace snapshots, restore points, audit history, and admin controls provide governed time
        travel without Git-backed arbitrary runtime mutation.
    - space_persistence_translated: >-
        Space Agent's space.yaml/widget YAML persistence model translates to EdgeGDE workspace
        manifests, canvas object records, D1 metadata, DO active state, KV direct lookup, and R2
        snapshots/assets.
    - widget_lifecycle_translated: >-
        Space Agent's widget lifecycle translates to EdgeGDE canvas object lifecycle: create,
        configure, move, resize, minimize, inspect, reload, disable, snapshot, audit, and remove.
    - prompt_context_translated: >-
        Current-space and current-widget prompt sections translate to compact EdgeGDE workspace
        transients: object catalog, selected object summary, recent tool result, policy decision, and
        post-write envelope.
    - staged_execution_translated: >-
        Space Agent's staged widget discovery and mutation workflow translates to EdgeGDE action
        proposal staging: discovery, proposal, policy check, user/system approval, apply, verify,
        audit.
    - empty_canvas_onboarding_translated: >-
        Empty-canvas example cards translate to EdgeGDE-owned onboarding templates and example
        workspace bundles.
    - zip_share_translated: >-
        ZIP export/import translates to governed EdgeGDE workspace bundle export/import with trust
        review, manifest diff, permission review, and no implicit authority transfer.
    - local_storage_rule_translated: >-
        Browser storage and IndexedDB drafts are non-authoritative. They improve responsiveness and
        offline continuity but never bypass EdgeGDE policy, audit, or server-side versioning.
    - browser_surface_rule_translated: >-
        Space Agent's browser surface concept translates to EdgeGDE's sandboxed MCP App iframe host
        and sandbox proxy. Third-party UI remains sandboxed and cannot call MCP servers directly.

space_agent_functional_requirements_extract:
  edgegde_native_translation:
    - space_agent_requirement: "The agent reshapes the interface"
      edgegde_requirement: "Agent panels propose canvas, app, tool, document, workflow, and lead-capture mutations."
      edgegde_authority: "EdgeGDE policy, expected_version, and audit apply or deny proposals."
    - space_agent_requirement: "The agent lives in the frontend runtime"
      edgegde_requirement: "EdgeGDE PWA provides the frontend runtime for canvas, windows, local drafts, and agent transients."
      edgegde_authority: "External Hermes/Aegis orchestration remains outside request execution paths; no worker-side LLM calls."
    - space_agent_requirement: "Text-based SKILL.md extensibility"
      edgegde_requirement: "Versioned mission and skill manifests are readable, scoped, and registry-controlled."
      edgegde_authority: "Aegis decides whether a mission/skill can run against a workspace, app, tool, or lead object."
    - space_agent_requirement: "Plain JavaScript execution blocks"
      edgegde_requirement: "Deterministic mutation protocol with expected_version, correlation_id, policy decision, and audit event."
      edgegde_authority: "No arbitrary third-party code or renderer source is persisted as authoritative UI."
    - space_agent_requirement: "Puzzle-piece modularity"
      edgegde_requirement: "Canvas object types, MCP App manifests, native applet adapters, mission templates, and extension seams compose additively."
      edgegde_authority: "EdgeGDE owns compatibility boundaries and upgrade paths."
    - space_agent_requirement: "Personal to hierarchical workspaces"
      edgegde_requirement: "Tenant, group, and user workspace permissions are explicit first-class objects."
      edgegde_authority: "Tenant isolation is enforced on every API call and every workspace mutation."
    - space_agent_requirement: "Per-user work and group sharing"
      edgegde_requirement: "Workspace sharing, export, import, and app installation require permission review and audit."
      edgegde_authority: "Shared artifacts cannot grant more authority than the receiving tenant permits."
    - space_agent_requirement: "Persistent admin and time travel"
      edgegde_requirement: "Snapshots, restore points, audit ledger, and admin controls support governed rollback."
      edgegde_authority: "Restore is policy-gated and correlation-tracked."
    - space_agent_requirement: "Spaces persist manifests and widget YAML"
      edgegde_requirement: "EdgeGDE workspace manifests, canvas object records, MCP App bindings, and snapshots persist in D1/DO/KV/R2."
      edgegde_authority: "EdgeGDE storage model, not Space Agent app-file storage, is authoritative."
    - space_agent_requirement: "Widget lifecycle and rendering"
      edgegde_requirement: "Canvas objects support create, configure, move, resize, minimize, inspect, reload, disable, snapshot, audit, and remove."
      edgegde_authority: "Third-party UI renders in sandboxed iframes; native applets are approved EdgeGDE adapters."
    - space_agent_requirement: "Current-space prompt context and transient sections"
      edgegde_requirement: "Agent panels receive compact workspace summaries, selected-object summaries, recent tool results, and post-write envelopes."
      edgegde_authority: "Prompts are summaries, not authoritative state; full state remains in EdgeGDE storage."
    - space_agent_requirement: "Staged discovery before mutation"
      edgegde_requirement: "Agent actions are staged into discovery, proposal, approval, apply, verify, and audit phases."
      edgegde_authority: "Dependent mutations require refreshed EdgeGDE state and a new expected_version."
    - space_agent_requirement: "Empty-canvas onboarding examples"
      edgegde_requirement: "EdgeGDE-owned onboarding templates create example workspaces, app objects, agent panels, and calculator flows."
      edgegde_authority: "Templates are curated EdgeGDE bundles, not arbitrary Space Agent widget clones."
    - space_agent_requirement: "Camera-based canvas navigation"
      edgegde_requirement: "Infinite canvas supports pan, zoom, occupied-span framing, background drag panning, and viewport-sized rendering."
      edgegde_authority: "Canvas camera state is local UI state; object positions are EdgeGDE workspace state."
    - space_agent_requirement: "Share/export/import"
      edgegde_requirement: "Workspace bundles export/import manifests, object records, app bindings, snapshots, and audit references."
      edgegde_authority: "Import requires trust review, permission diff, and explicit activation."
    - space_agent_requirement: "Browser storage is non-authoritative"
      edgegde_requirement: "IndexedDB stores local drafts, pending sync queue, cached manifests, and transient agent context."
      edgegde_authority: "Server-side EdgeGDE state is authoritative after sync and policy validation."

