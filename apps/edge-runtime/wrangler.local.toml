# EdgeGDE — Local Development Configuration
# Uses Miniflare for isolated local testing.
#
# Usage:
#   npx wrangler dev --local --config wrangler.local.toml
#   or: npm run dev

name = "edgegde-calculator-dev"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# Local KV namespace stubs
kv_namespaces = [
  { binding = "ARTIFACT_KV", id = "local", preview_id = "local" },
  { binding = "TENANT_KV", id = "local", preview_id = "local" },
  { binding = "TELEMETRY_KV", id = "local", preview_id = "local" },
]

# Local D1 stub
[[d1_databases]]
binding = "DB"
database_name = "edgegde-local"
database_id = "local"

# Local R2 stub
[[r2_buckets]]
binding = "VAULT_BUCKET"
bucket_name = "edgegde-vault-local"

# Local queue stub
[[queues.producers]]
binding = "LEAD_SCORING_QUEUE"
queue = "edgegde-lead-scoring-local"

[[queues.producers]]
binding = "FORECASTING_QUEUE"
queue = "edgegde-forecasting-local"

[[queues.consumers]]
queue = "edgegde-lead-scoring-local"
max_retries = 3
max_batch_size = 10

[[queues.consumers]]
queue = "edgegde-forecasting-local"
max_retries = 3
max_batch_size = 10

# Durable Object stubs
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "AUDIT_LEDGER"
class_name = "AuditLedger"

[[durable_objects.bindings]]
name = "CANVAS_SESSION"
class_name = "CanvasSession_DO"

[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession_DO"

[[migrations]]
tag = "v1"
new_classes = ["RateLimiter", "AuditLedger"]

[[migrations]]
tag = "v2"
new_classes = ["CanvasSession_DO", "ChatSession_DO"]

[vars]
CANVAS_CHAT_LLM_PROVIDER = "ollama"
OLLAMA_CHAT_URL = "http://127.0.0.1:11434/api/chat"
OLLAMA_CHAT_MODEL = "qwen3-coder:30b"
OLLAMA_CHAT_TIMEOUT_MS = 180000

[assets]
directory = "public"
