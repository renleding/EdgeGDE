      - "Aider invocation contract"

  - date: "2026-05-23"
    title: "Routa Setup + Database Unification (Historical)"
    description: >
      Historical archive only: earlier experiments included a Routa Web UI and
      CLI server. This is no longer part of the supported architecture after the
      2026-06-13 deprecation.
    components_affected:
      - "Historical archive"

# ───────────────────────────────────────────────────────────────────────────
# DATA FLOW
# ───────────────────────────────────────────────────────────────────────────

data_flow:
  description: "End-to-end flow from user goal to code change"

  steps:
    - step: 1
      actor: "User"
      action: "Provides high-level product goal via Hermes CLI"
      channel: "Terminal chat"

    - step: 2
      actor: "Hermes (Strategic Director)"
      action: |
        Decomposes goal into atomic DAG-ordered tasks.
        Each task has: task_id, description, target_files (max 3), test_command.
        Validates dependencies, checks idempotency, enforces schema.
      output: "Task payload → explicit Git branch and TDD workflow"

    - step: 3
      actor: "Hermes (Execution State)"
      action: |
        Tracks task state through chat context, Todo discipline, and Git branch status.
        No separate Routa service is expected.
      storage: "Hermes Workspace, Git branches, verification logs"

    - step: 4
      actor: "Aider (File Mutation Engine)"
      action: |
        Invokes Aider with target_files + sanitized instruction + test_command.
        Runs inside work/{task_id} branch with hard timeout: 900s. Structured JSONL logging.
      storage: "Git branch, verification logs"

    - step: 5
      actor: "Aider (File Mutation Engine)"
      action: |
        Reads only explicit target_files.
        Generates code changes via LiteLLM proxy → OpenRouter → Phala (qwen-2.5-7b-instruct).
        All model traffic flows through the centralized gateway on port 4000.
        Auto-commits with --commit flag.
        Runs test_command for verification (TDD loop).
      output: "Git commit → feature branch"

    - step: 6
      actor: "Hermes (Post-Execution)"
      action: |
        On success: verify clean tree and tests, then summarize result.
        On failure: capture logs, stash if needed, split/rewrite task, and retry up to 3 times.
      output: "Completed task summary or Blocked task with evidence"

    - step: 7
      actor: "Hermes (Deflation Gate)"
      action: |
        If Blocked: inspect logs → identify error type → rewrite/split/retry (max 3).
        If all tasks Done: emit completion signal → halt loop.
      control: "observe → decide → act → sleep 5s"

    - step: 8
      actor: "User"
      action: "Reviews result via Hermes CLI summary and Git diff"
