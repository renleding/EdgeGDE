# ═══════════════════════════════════════════════════════════════════════════
# SYSTEM ARCHITECTURE — Full System Description
# ═══════════════════════════════════════════════════════════════════════════
# Host: macOS 15.7.3 (Sequoia) — Apple Silicon M1
# User: warren — AI/ML Engineer
# Root: /Users/warren/Documents/_HQ_AI/
# ───────────────────────────────────────────────────────────────────────────

system:
  name: "EdgeGDE Orchestration Platform"
  version: "2.1.0"
  role: "Autonomous software delivery lifecycle — strategic director decomposes goals
         into atomic tasks, orchestrates execution across Aider, and enforces
         quality gates via TDD and structured observability."

  engineering_principles:
    - "Hermes NEVER writes raw code — all file mutations go through Aider"
    - "Hermes Workspace is the active task UI; Routa is deprecated"
    - "DAG-ordered execution — downstream blocks until upstream Done"
    - "TDD enforced: failing test first → implement → verify passes"
    - "Max 3 retries per task, each retry changes strategy"
    - "No raw secrets in chat — interactive credential scripts only"
    - "Deprecated legacy services are not auto-launched"
    - "Parallel work via git worktrees — each agentic session gets its own
       isolated worktree under EdgeGDE-worktrees/ with work/ branch"
    - "Path convention: ../<repo>-worktrees/work-<name>/ — all worktrees
       discoverable under one sibling directory"

# ───────────────────────────────────────────────────────────────────────────
# LAYER 1: USER INTERFACE & CONTROL PLANE
# ───────────────────────────────────────────────────────────────────────────

interfaces:

  - name: "Hermes CLI Agent"
    description: "Strategic director / control-plane orchestrator. The primary interface
                   the user interacts with. Runs as a terminal chat agent with tool-use
                   access to the full system stack."
    transport: "CLI (terminal)"
    model: "deepseek/deepseek-v4-flash"       # Planner/chat model
    provider: "LiteLLM proxy → DeepSeek direct API"
    routing: "custom:litellm-proxy @ http://127.0.0.1:4000/v1"
    capabilities:
      - "Goal decomposition into atomic DAG-ordered tasks"
      - "Task lifecycle management via Hermes Workspace and explicit CLI/Git workflow"
      - "Code generation delegation to Aider"
      - "Research via deep-research/fast-research skill profiles"
      - "System dashboard and observability"
    persistent_memory:
      system: "MemPalace (port 8888) — 165 semantic drawers across 7 wings"
      user: "In-memory key-value store (~2KB, ~8 entries)"

  - name: "Hermes Workspace"
    description: "Web UI for chat, tools, files, memory, and job management.
                   Built with TanStack Start (React) + Vite."
    url: "http://localhost:3000"
    tech_stack: "Node.js 26, Vite, TanStack Start, React"
    port: 3000
    status: "UP"

  - name: "System Health Dashboard"
    description: "Dark-themed draggable/responsive SPA showing all service health,
                   route matrix, container status, resource usage, and architecture diagrams."
    url: "http://localhost:8899/system-dashboard.html"
    port: 8899
    tech: "Static HTML/CSS/JS + Mermaid.js (CDN)"
    features:
      - "Draggable and resizable cards with localStorage persistence"
      - "Mermaid.js architecture diagrams (flowchart, state, mindmap, pie)"
      - "Auto-refresh every 5 minutes"
      - "Responsive across desktop/tablet/mobile"
    status: "UP"
    cards:
      - architecture_diagram
      - service_status_grid
      - system_resources
      - active_chat_path
      - litellm_route_matrix
      - service_dependency_graph
      - mempalace_drawer_tree
      - podman_containers
      - worktree_status        # Active worktrees, branches, ages, status
                                 # (planned — Stream E)

# ───────────────────────────────────────────────────────────────────────────
# LAYER 2: TASK ORCHESTRATION & STATE MACHINE
# ───────────────────────────────────────────────────────────────────────────

task_orchestration:
  status: "Hermes Workspace / CLI task discipline"
  note: "Routa is deprecated. Active task state lives in Hermes Workspace, chat context, and explicit CLI/Git workflow rather than a separate Routa service."

deprecated_components:
  - name: "Routa"
    status: "DEPRECATED"
    reason: "No active Routa repo, binary, or service is present in this workspace. The old :3001 Web UI and :3210 CLI service are not part of the supported stack."
    removed_ports:
      - 3001
      - 3210
    migration: "Use Hermes Workspace on :3000 for UI, and branch/TDD/verification workflow for execution state."

  - name: "Aider"
    description: "Stateless file mutation engine — the execution layer. Invoked
                   programmatically by Hermes or the worker daemon."
    binary: "/Library/Frameworks/Python.framework/Versions/3.11/bin/aider"
    version: "0.86.2"
    default_model: "coder-model (via LiteLLM proxy)"
    provider: "LiteLLM proxy → OpenRouter → Phala provider"
    pricing: "$0.04/M prompt tokens, $0.10/M completion tokens (via OpenRouter)"
    config: "/Users/warren/.aider.conf.yml"
    routing:
      type: "LiteLLM proxy (centralized)"
      base_url: "http://127.0.0.1:4000/v1"
      model_name: "coder-model"
      auth: "LiteLLM master key"
      benefit: "Central observability, token tracking, caching — all model traffic flows through one gateway"
    invocation_flags:
      - "--yes"          # auto-approve file changes — prevents TUI hang in headless mode
      - "--commit"        # ensure Git traceability on every mutation
      - "--no-stream"     # structured machine-readable output for log parsing
      - "--test <CMD>"    # self-healing loop: run test, fix if failing, repeat until pass
    constraints:
      headless_safety:
        - "NEVER invoked interactively — always --yes, never requires stdin"
        - "PTY/terminal not required — runs via subprocess.Popen with shell=False"
        - "Timeout enforced by parent at 900s — process tree killed on exceed"
        - "Input sanitized before send: strip markdown fences, escape quotes, remove formatting noise"
      file_scope:
        - "NEVER accesses full repo — only explicit target_files list"
        - "Max 3 files per invocation"
        - "Strict diff edit format — never rewrites files wholesale"
        - "No implicit context — every task is self-contained; no assumed code structure"
      git_discipline:
        - "Runs inside isolated git branch: work/{task_id}"
        - "Auto-commits via --commit flag for traceability"
        - "On failure: working tree is abandoned, branch deleted, parent checks out main"
      verification:
        - "Test command runs after every edit (--test flag)"
        - "If test fails, Aider auto-heals and retries within its own loop"
        - "If Aider's loop exceeds 900s, parent kills process and marks task Blocked"
        - "Post-execution: worker verifies git tree is clean before marking Done"
    auth:
      method: "LiteLLM proxy master key (sk-lit...)"
      storage: "~/.aider.conf.yml → api-key field"
      routing: "All model traffic flows through http://127.0.0.1:4000/v1"
    status: "UP"

# ───────────────────────────────────────────────────────────────────────────
