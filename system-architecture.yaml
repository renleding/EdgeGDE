                   through a single endpoint with per-model rate limits."
    transport: "Podman container (ghcr.io/berriai/litellm:main-latest)"
    container: "litellm-proxy — Up 6 hours"
    port: 4000
    config: "/Users/warren/.hermes/litellm/config.yaml"
    auth: "Master key: sk-lit... (general_settings)"
    status: "UP"

  routes:
    - route_name: "planner-model"
      model: "deepseek/deepseek-v4-flash"
      path: "LiteLLM → api.deepseek.com (direct BYOK)"
      api_key: "sk-a45... (direct DeepSeek key)"
      rpm: 10
      avg_latency: "1.1s"
      status: "ACTIVE"
      purpose: "Hermes chat, high-level reasoning, and planning"

    - route_name: "v4-flash-or"
      model: "openrouter/deepseek/deepseek-v4-flash"
      path: "LiteLLM → OpenRouter → DeepSeek (BYOK via OR)"
      api_key: "OpenRouter key (os.environ/OPENROUTER_API_KEY)"
      rpm: 10
      avg_latency: "5.3s"
      status: "AVAILABLE"
      purpose: "Fallback BYOK path via OpenRouter routing"

    - route_name: "coder-model"
      model: "openrouter/qwen/qwen-2.5-7b-instruct"
      path: "LiteLLM → OpenRouter → Phala provider"
      api_key: "OpenRouter key (os.environ/OPENROUTER_API_KEY)"
      rpm: 60
      status: "AVAILABLE"
      purpose: "Aider default model — code generation and file mutation"

    - route_name: "fast-model"
      model: "openrouter/qwen/qwen-2.5-7b-instruct"
      path: "LiteLLM → OpenRouter → Phala provider"
      api_key: "OpenRouter key (os.environ/OPENROUTER_API_KEY)"
      rpm: 60
      status: "AVAILABLE"
      purpose: "Quick completions, fast-path tool routing"

    - route_name: "qwen2.5-7b"
      model: "openrouter/qwen/qwen-2.5-7b-instruct"
      path: "LiteLLM → OpenRouter"
      api_key: "OpenRouter key (os.environ/OPENROUTER_API_KEY)"
      rpm: 60
      status: "AVAILABLE"
      purpose: "Direct alias for benchmark/comparison"

    - route_name: "vision-model"
      model: "openrouter/nvidia/nemotron-nano-12b-v2-vl:free"
      path: "LiteLLM → OpenRouter (free tier)"
      api_key: "OpenRouter key (os.environ/OPENROUTER_API_KEY)"
      rpm: 10
      status: "AVAILABLE"
      purpose: "Image analysis and vision-capable tasks"

  local_fallback:
    - engine: "Ollama"
      port: 11434
      status: "UP (idle)"
      purpose: "Optional local inference — routes defined in LiteLLM config but commented out"
      available_models:
        - "qwen3-coder:30b"
        - "qwen3.5:4b"
        - "qwen3-vl:4b"

  api_keys:
    openrouter:
      source: "~/.hermes/.env → OPENROUTER_API_KEY"
      user: "renleding"
      storage: "scoped token with repo, gist, read:org, workflow scopes"
    deepseek_direct:
      source: "hardcoded in LiteLLM config.yaml → api_key field"
      purpose: "Planner model only — avoids OpenRouter relay latency"
    litellm_master:
      value: "sk-lit... (general_settings.master_key)"
      purpose: "Authenticate requests to the LiteLLM proxy"

