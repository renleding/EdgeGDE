# ═══════════════════════════════════════════════════════════════════════════
# LAYER 8: PLATFORM INVARIANTS (Hard Rules)
# ═══════════════════════════════════════════════════════════════════════════

platform_invariants:

  routing:
    - rule: "Proxy Interception"
      description: "Every outbound LLM interaction MUST route through LiteLLM proxy at http://127.0.0.1:4000/v1"
      applies_to: ["Hermes", "Aider", "Worker", "CLI instances"]
      prohibited: "Direct cloud provider bypass paths"

    - rule: "Port Isolation"
      description: "Hermes Workspace UI is the supported local UI on :3000; deprecated legacy UI ports are not expected to run."
      applies_to: ["Sub-agents", "Hermes orchestration calls"]
      requirement: "All state orchestration calls must explicitly declare the target platform or service."

    - rule: "Aider Proxy Binding"
      description: "Aider config must use openai-api-base pointing to LiteLLM proxy with coder-model"
      config_path: "~/.aider.conf.yml"
      enforced_values:
        openai_api_base: "http://127.0.0.1:4000/v1"
        model: "openai/coder-model"
        api_key: "LiteLLM master key (sk-lit...)"


  execution:
    - rule: "No Direct Code Write"
      description: "Hermes NEVER writes code. All file mutations go through Aider."

    - rule: "Max 3 Retries"
      description: "Blocked tasks get max 3 retries, each with a different strategy."

    - rule: "TDD Enforcement"
      description: "Every task must have a test_command. Test must fail before → pass after."

    - rule: "Anti-Hallucination"
      description: "Verify file existence before edit. Never assume API structure without evidence."

