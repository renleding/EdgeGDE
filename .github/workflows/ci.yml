name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test --filter="@edgegde/schema"
      - run: bunx tsx tests/compiler/edr-engine.test.ts
        working-directory: apps/edge-runtime
      - run: bunx tsc --noEmit
        working-directory: apps/edge-runtime
