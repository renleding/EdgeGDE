name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/edge-runtime

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        name: TypeScript check

  unit-tests:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/edge-runtime

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
        name: Unit tests (compute-drift, lifecycle, gogo, replay)

  swe-bench-lint:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install datasets>=3.0.0
        name: Install deps
      - run: python3 -c "import ast; ast.parse(open('tools/swe-bench/adapter.py').read()); print('ok adapter')"
        name: Validate adapter.py
      - run: python3 tools/swe-bench/adapter.py --help > /dev/null 2>&1 || true
        name: adapter.py imports
      - run: python3 tools/lsp-gate/lsp-validate.py --help > /dev/null 2>&1 || true
        name: lsp-validate.py imports
      - run: python3 tools/aegis.py policy validate
        name: Aegis policy integrity
      - run: python3 tools/redteam_test.py run
        name: Aegis red-team tests

  code-quality:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: apps/edge-runtime
        run: bun install --frozen-lockfile
      - name: Governance compliance check
        working-directory: apps/edge-runtime
        run: npx tsx ../../tools/governance-check.ts --diff-only
      - name: Lint check
        working-directory: apps/edge-runtime
        run: bun run lint 2>&1 || true
        continue-on-error: true
