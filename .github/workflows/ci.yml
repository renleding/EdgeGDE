name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/edge-runtime

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        name: TypeScript check

  unit-tests:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/edge-runtime

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
        name: Unit tests (compute-drift, lifecycle, gogo, replay)
      - run: bun run test:coverage 2>&1 | tail -20
        name: Coverage gate (thresholds enforced in vitest.coverage.config.ts)
        # NO continue-on-error — coverage below threshold fails CI and blocks merge.
        # Thresholds ratchet up in each coverage batch PR (EG-TEST-0009).

  swe-bench-lint:
    # Aegis governance lint + SWE-bench adapter sanity.
    #
    # THE JOB NAME IS LOAD-BEARING. `swe-bench-lint` is a REQUIRED status check on
    # main, so a job-level `paths:` filter here would make the job not run at all on
    # an unrelated PR — and a required check that never reports stays "Expected —
    # waiting for status" indefinitely, blocking every merge. The job therefore always
    # runs and always reports a conclusion; only the SWE-bench-specific steps are
    # conditional, which scopes the cost without ever leaving the check pending.
    #
    # It also does not need `unit-tests`: nothing here reads TypeScript or unit-test
    # output. Waiting on typecheck -> unit-tests -> coverage only added latency.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the change-detection diff below can reach the base commit.
          fetch-depth: 0

      - name: Detect whether SWE-bench tooling changed
        id: scope
        if: github.event_name == 'pull_request'
        # The Aegis policy and red-team checks below are governance gates and run on
        # EVERY pull request. The SWE-bench adapter steps and their ~2-minute
        # `datasets` install are only relevant when the tooling itself is touched, so
        # they are scoped rather than run on e.g. a Tesla-only change.
        run: |
          base="${{ github.base_ref }}"
          git fetch --depth=1 origin "$base"
          if git diff --name-only "origin/$base...HEAD" \
               | grep -qE '^(tools/|\.github/|automation/|prompts/|AGENTS\.md)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "SWE-bench tooling changed - running adapter steps."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No SWE-bench tooling change - Aegis gates still run below."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # The `datasets` install pulls pyarrow/pandas/numpy and dominated this job
          # (~123s of a ~130s runtime). Caching the pip download cache cuts repeat
          # installs substantially. Gated on the same condition as the install.
          cache: 'pip'
        if: github.event_name != 'pull_request' || steps.scope.outputs.relevant == 'true'

      - run: pip install 'datasets>=3.0.0'
        name: Install deps
        if: github.event_name != 'pull_request' || steps.scope.outputs.relevant == 'true'

      - run: python3 -c "import ast; ast.parse(open('tools/swe-bench/adapter.py').read()); print('ok adapter')"
        name: Validate adapter.py
        # Syntax only -- takes no imports, so it needs no install.
        if: github.event_name != 'pull_request' || steps.scope.outputs.relevant == 'true'

      - run: python3 tools/swe-bench/adapter.py --help > /dev/null
        name: adapter.py imports
        # NO `|| true`. The step exists to prove adapter.py's module-level imports
        # resolve; `|| true` made it the one step guaranteed to pass, so the two-minute
        # install bought nothing. Verified locally that this correctly FAILS when
        # `datasets` is absent, which is the behaviour the step claims to have.
        if: github.event_name != 'pull_request' || steps.scope.outputs.relevant == 'true'

      - run: python3 tools/lsp-gate/lsp-validate.py --help > /dev/null
        name: lsp-validate.py imports
        # NO `|| true`, same reason. Verified this tool does not import `datasets`, so
        # it needs no install and can run unconditionally.

      # --- Aegis governance: unconditional, on every pull request -------------
      - run: python3 tools/aegis.py policy validate
        name: Aegis policy integrity

      - run: python3 tools/redteam_test.py run
        name: Aegis red-team tests

  code-quality:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: apps/edge-runtime
        run: bun install --frozen-lockfile
      - name: Fetch base branch for diff-based governance
        # PR-only: on push-to-main github.base_ref is empty, so this would fall back to
        # fetching origin/main --depth=1 and collapse the shallow history, breaking HEAD~1
        # for diff-based governance (GOVERNANCE_DIFF_ERROR, Aug 2026).
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}" --depth=1
      - name: Governance compliance check
        working-directory: apps/edge-runtime
        run: npx tsx ../../tools/governance-check.ts --diff-only
      - name: Lint check
        working-directory: apps/edge-runtime
        run: bun run lint 2>&1 || true
        continue-on-error: true
      - name: Replay test (verify past missions against current code)
        run: python3 tools/replay.py run --recent 5 2>&1 || echo "Replay completed (no mission log yet expected on fresh CI)"

  automation-sync:
    # The Hermes automation that merges every PR previously lived only in
    # ~/.hermes/scripts/ (not version controlled), so it received no review.
    # This gate keeps automation/hermes/ honest: a file edited directly in the
    # repo instead of at the source of truth fails here.
    #
    # Runs without ~/.hermes/scripts — in that case --check validates the
    # committed files against automation/hermes/.sync-manifest instead.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Automation mirror integrity
        run: ./automation/hermes/sync-to-repo.sh --check

  tesla-schema:
    # FRS-010 F08. Validates the Tesla D1 migrations and, on main, applies them.
    #
    # Two distinct things are checked, and they cannot be collapsed into one:
    #
    #   verify-schema.sh  applies all four files to a throwaway SQLite database
    #                     and asserts the FRS's own acceptance criteria. PR-safe,
    #                     no credentials, no network.
    #   migrations apply  runs against the real D1 database. Only on main, because
    #                     it mutates production state.
    #
    # Migration application is CI-only per AGENTS.md: never from an agent pane.
    # The database `afirmico-tesla` already exists in the account, so the apply
    # step does not need to create it — it only applies pending migrations.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # sqlite3 is preinstalled on ubuntu-latest; the verify script depends on it.
      - name: Verify sqlite3 available
        run: sqlite3 --version

      - name: Install dependencies
        working-directory: apps/afirmico-tesla
        run: bun install --frozen-lockfile

      - name: Verify Tesla schema against FRS-010 acceptance criteria
        working-directory: apps/afirmico-tesla
        run: bun run verify:schema

      - name: Verify store code against the schema
        # verify:schema proves the SQL is valid; this proves src/store.ts agrees
        # with it. A column renamed in one and not the other typechecks cleanly
        # and fails only when a member tries to connect.
        working-directory: apps/afirmico-tesla
        run: bun run verify:store

      - name: Typecheck
        working-directory: apps/afirmico-tesla
        run: bun run typecheck

      - name: Unit tests
        working-directory: apps/afirmico-tesla
        run: bun run test

      # ── Below this line: production mutations. Main only. ──
      - name: Apply D1 migrations (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/afirmico-tesla
        run: npx wrangler d1 migrations apply afirmico-tesla --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirm catalogs loaded
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/afirmico-tesla
        run: |
          # A silently-empty catalog is the failure mode that matters: the seeds
          # are the whole point of the migration, and an apply that reports
          # success while inserting nothing is undetectable from the exit code.
          for q in \
            "SELECT count(*) FROM tesla_field_catalog" \
            "SELECT count(*) FROM tesla_alert_catalog" \
            "SELECT count(*) FROM tesla_endpoint_catalog" \
            "SELECT policy_version, policy_sha256 FROM tesla_consent_policy WHERE superseded_at IS NULL" \
            "SELECT count(*) FROM tesla_field_catalog WHERE collected = 1"
          do
            echo "--- $q"
            npx wrangler d1 execute afirmico-tesla --remote --command "$q"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ═══ DEPLOY ═══
      # Until this step existed, nothing in .github/workflows deployed this
      # worker: merges to main applied the migrations and left the code stale
      # until someone ran `wrangler deploy` by hand. That is why the v1.17
      # consent text and the /connect rewording both merged but were not live.
      #
      # It lives in this job, not a new one, because it must run AFTER the
      # migrations: the worker's /healthz compares the rendered consent text
      # against the policy row, so deploying ahead of the seed reports
      # STALE_TEXT_HASH for the gap between the two. One job, ordered, so there
      # is no race between two workflows both triggered by a push to main.
      - name: Deploy afirmico-tesla (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/afirmico-tesla
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment is live
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Readiness, not liveness: /healthz reports the policy version and any
          # config gaps by name, so a deploy that shipped broken config fails
          # here rather than at a member's first click. /healthz is served
          # no-store, so this reads the deployment that just landed.
          #
          # Only the surface this workflow deploys is asserted. Ingest is not
          # reachable in production yet (the Oracle relay carries no services),
          # so it is deliberately not probed — a probe for it would fail the
          # deploy for a reason this workflow cannot fix.
          for attempt in 1 2 3 4 5; do
            body=$(curl -s --max-time 10 https://auto.afirmi.co/healthz || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "$body"
              echo "afirmico-tesla is live and healthy"
              exit 0
            fi
            echo "attempt $attempt: not healthy yet — $body"
            sleep 10
          done
          echo "afirmico-tesla did not report healthy after deploy"
          exit 1

