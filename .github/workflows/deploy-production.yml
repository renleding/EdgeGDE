name: Deploy — Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deploy (skip validation gates)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  WORKER: edgegde-calculator
  STAGING_WORKER: edgegde-calculator-staging

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # VALIDATE — 7 gates, all must pass
  # Auto-deploys on success. Manual override via workflow_dispatch with force=true.
  # ═══════════════════════════════════════════════════════════════════════
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/edge-runtime

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ═══ GATE 1: TypeScript type check ═══
      - name: Gate 1 — Typecheck
        run: bun run typecheck

      # ═══ GATE 2: Unit tests ═══
      - name: Gate 2 — Unit tests
        run: bun run test:unit

      # ═══ GATE 3: Governance compliance ═══
      - name: Gate 3 — Governance compliance
        run: npx tsx ../../tools/governance-check.ts --diff-only

      # ═══ GATE 4: Lint ═══
      - name: Gate 4 — Lint
        run: bun run lint 2>&1 | head -50 || true

      # ═══ GATE 5: Security audit ═══
      - name: Gate 5 — Security audit
        run: bun audit 2>&1 | tail -10 || echo "bun audit not available — skipping"

      # ═══ GATE 6: Staging health check + E2E ═══
      - name: Gate 6a — Staging health check
        run: |
          echo "Checking staging worker: https://${{ env.STAGING_WORKER }}.renleding.workers.dev/"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://${{ env.STAGING_WORKER }}.renleding.workers.dev/healthz" || echo "000")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "401" ]; then
            echo "✅ Staging healthy (HTTP $HTTP_CODE)"
          else
            echo "❌ Staging unhealthy (HTTP $HTTP_CODE) — aborting deployment"
            exit 1
          fi

      - name: Gate 6b — E2E tests against staging
        run: |
          echo "Running E2E test suite against staging..."
          EDGE_RUNTIME_BASE_URL=https://${{ env.STAGING_WORKER }}.renleding.workers.dev \
            bun run test:e2e 2>&1
          echo "✅ E2E tests passed against staging"

      # ═══ GATE 7: Commit log review ═══
      - name: Gate 7 — Commit log review
        run: |
          echo "=== Recent commits on main ==="
          git log --oneline -5 --no-merges
          echo "=== Files changed ==="
          git diff --stat HEAD~1 HEAD 2>/dev/null || echo "No diff"

      # ═══ FORCE OVERRIDE: skip gate check if force=true ═══
      - name: Check force override
        id: check-force
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "⚠️  Force deploy requested — skipping validation gates"
            echo "force=true" >> $GITHUB_OUTPUT
          else
            echo "force=false" >> $GITHUB_OUTPUT
          fi

      # ═══ DEPLOY ═══
      - name: Deployment summary
        run: |
          echo "=== Production Deployment ==="
          echo "Worker:  ${{ env.WORKER }}.renleding.workers.dev"
          echo "Commit:  ${{ github.sha }}"
          echo "Author:  ${{ github.event.head_commit.author.name || 'workflow_dispatch' }}"
          echo "Message: ${{ github.event.head_commit.message || 'manual trigger' }}"
          echo "Date:    $(date -u)"

      - name: Copy AI Tutor PWA assets
        run: node ../../apps/ai-tutor/scripts/copy-static.mjs

      - name: Deploy to production
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy health check
        run: |
          sleep 10
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://${{ env.WORKER }}.renleding.workers.dev/healthz" || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "401" ]; then
              echo "✅ Production healthy (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE — retrying in 5s..."
            sleep 5
          done
          echo "❌ Production health check failed after 3 attempts"
          echo "Rollback: bash scripts/rollback.sh production"
          exit 1

      - name: Record deployment
        run: |
          mkdir -p .deploy-log
          echo "Commit: ${{ github.sha }}" >> .deploy-log/$(date -I).log
          echo "Deployed at: $(date -u)" >> .deploy-log/$(date -I).log
          echo "Version: $(curl -s -o /dev/null -w '%{http_code}' https://${{ env.WORKER }}.renleding.workers.dev/healthz)" >> .deploy-log/$(date -I).log
