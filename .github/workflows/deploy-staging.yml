name: Deploy — Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/edge-runtime

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Copy AI Tutor PWA assets
        run: node ../../apps/ai-tutor/scripts/copy-static.mjs

      # ═══ D1 MIGRATIONS (CI-only per AGENTS.md) ═══
      # Apply pending migrations BEFORE deploy so schema and code travel together.
      - name: Apply D1 migrations (staging)
        run: |
          npx wrangler d1 migrations apply ebroker_leads_staging --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to staging
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Health check
        run: |
          sleep 10
          curl -s -o /dev/null -w "%{http_code}" https://edgegde-calculator-staging.renleding.workers.dev/ | grep -q "200\|302\|401" && echo "Staging healthy" || echo "Warning: staging health check failed"
